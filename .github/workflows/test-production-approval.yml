name: Test production approval only

on:
  workflow_dispatch:

permissions: {}

jobs:
  approval-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: production
    steps:
      - name: Record approved test
        shell: bash
        run: |
          printf '%s\n' 'Production approval gate passed. No server access or deployment performed.'
          printf '%s\n' 'Approval-only test completed after the production environment gate.' >> "$GITHUB_STEP_SUMMARY"
